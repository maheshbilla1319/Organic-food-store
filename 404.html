<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found - GreenHarvest</title>

    <meta
        name="description"
        content="The page you are looking for could not be found."
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- AOS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/aos@2.3.4/dist/aos.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- 404 CSS -->
    <link rel="stylesheet" href="css/404.css">
</head>

<body>

    <!-- ================= 404 HERO ================= -->
    <main>

        <section class="error-section">

            <!-- Background Shapes -->
            <div class="organic-shape shape-one"></div>
            <div class="organic-shape shape-two"></div>
            <div class="organic-shape shape-three"></div>


            <div class="container error-container">

                <!-- ================= LEFT CONTENT ================= -->
                <div
                    class="error-content"
                    data-aos="fade-right"
                    data-aos-duration="900"
                >

                    <span class="error-tag">
                        <i class="fa-solid fa-seedling"></i>
                        Freshly Lost
                    </span>


                    <h1>
                        Oops!
                        <span>404</span>
                    </h1>


                    <h2>
                        This page has
                        <br>
                        gone organic.
                    </h2>


                    <p>
                        Looks like the page you're looking for has
                        wandered off into the garden. Don't worry,
                        we'll help you get back to fresh content.
                    </p>


                    <!-- Buttons -->
                    <div class="error-buttons">

                        <a
                            href="index.html"
                            class="btn btn-primary"
                        >
                            <i class="fa-solid fa-house"></i>
                            Back to Home
                        </a>


                        <button
                            type="button"
                            class="btn btn-outline"
                            id="backBtn"
                        >
                            <i class="fa-solid fa-arrow-left"></i>
                            Go Back
                        </button>

                    </div>


                    <!-- Countdown -->
                    <div class="redirect-box">

                        <div class="redirect-icon">
                            <i class="fa-solid fa-clock"></i>
                        </div>


                        <div class="redirect-text">

                            <span>
                                Taking you home in
                            </span>

                            <strong id="countdown">
                                10
                            </strong>

                            <span>
                                seconds
                            </span>

                        </div>

                    </div>

                </div>


                <!-- ================= RIGHT VISUAL ================= -->
                <div
                    class="error-visual"
                    data-aos="fade-left"
                    data-aos-duration="1000"
                >

                    <!-- Main Circle -->
                    <div class="visual-circle"></div>


                    <!-- Floating Leaves -->
                    <div class="leaf leaf-one">
                        <i class="fa-solid fa-leaf"></i>
                    </div>

                    <div class="leaf leaf-two">
                        <i class="fa-solid fa-leaf"></i>
                    </div>

                    <div class="leaf leaf-three">
                        <i class="fa-solid fa-leaf"></i>
                    </div>


                    <!-- 404 Number -->
                    <div class="error-number">

                        <span>4</span>

                        <div class="zero">

                            <div class="zero-inner">
                                <i class="fa-solid fa-seedling"></i>
                            </div>

                        </div>

                        <span>4</span>

                    </div>


                    <!-- Soil -->
                    <div class="soil">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>


                    <!-- Plant -->
                    <div class="plant">

                        <div class="stem"></div>

                        <div class="plant-leaf plant-leaf-left">
                            <i class="fa-solid fa-leaf"></i>
                        </div>

                        <div class="plant-leaf plant-leaf-right">
                            <i class="fa-solid fa-leaf"></i>
                        </div>

                    </div>


                    <!-- Fresh Card -->
                    <div class="floating-card card-one">

                        <i class="fa-solid fa-carrot"></i>

                        <div>
                            <strong>Fresh</strong>
                            <span>Every day</span>
                        </div>

                    </div>


                    <!-- Organic Card -->
                    <div class="floating-card card-two">

                        <i class="fa-solid fa-apple-whole"></i>

                        <div>
                            <strong>100%</strong>
                            <span>Organic</span>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= AOS ================= -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- ================= 404 JS ================= -->
    <script src="js/404.js"></script>

</body>
</html>
